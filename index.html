        // Advanced Gibberish Detector
        function isGibberishQuery(query) {
            const trimmed = query.trim();
            if (!trimmed || trimmed.length < 2) return true;
            
            // 1. Long unspaced string (e.g. fdjsyfjmygjjhn)
            if (!trimmed.includes(' ') && trimmed.length > 12) return true;

            // 2. High consonant-to-vowel check for keyboard mashes
            const vowels = (trimmed.match(/[aeiouyAEIOUY]/g) || []).length;
            const consonants = (trimmed.match(/[bcdfghjklmnpqrstvwxzBCDFGHJKLMNPQRSTVWXZ]/g) || []).length;
            if (consonants > 7 && vowels === 0) return true;

            // 3. Repeated adjacent characters (e.g., "asdfghjk", "zzzzzzz")
            if (/(.)\1{3,}/.test(trimmed)) return true;
            if (/^[asdfghjklqwertyuiopzxcvbnm]{8,}$/i.test(trimmed) && vowels < 2) return true;

            return false;
        }

        // Single Circular Custom Cursor
        function SingleCircularCursor() {
            const [pos, setPos] = useState({ x: -100, y: -100 });
            const [clicked, setClicked] = useState(false);

            useEffect(() => {
                const handleMouseMove = (e) => {
                    setPos({ x: e.clientX, y: e.clientY });
                };
                const handleMouseDown = () => setClicked(true);
                const handleMouseUp = () => setClicked(false);

                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mousedown', handleMouseDown);
                window.addEventListener('mouseup', handleMouseUp);
                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mousedown', handleMouseDown);
                    window.removeEventListener('mouseup', handleMouseUp);
                };
            }, []);

            return (
                <div 
                    className="fixed pointer-events-none z-[99999] transition-transform duration-75 ease-out"
                    style={{ left: `${pos.x}px`, top: `${pos.y}px`, transform: `translate(-50%, -50%) scale(${clicked ? 0.8 : 1})` }}

            );
        }

        // Multi-Colored Twinkling Canvas Starfield Background
        function StarfieldBackground() {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;

                let width = (canvas.width = window.innerWidth);
                let height = (canvas.height = window.innerHeight);

                const handleResize = () => {
                    if (!canvas) return;
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', handleResize);

                const starCount = 450;
                const stars = [];
                const colors = ['#ffffff', '#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24'];

                for (let i = 0; i < starCount; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.95,
                        vy: (Math.random() - 0.5) * 0.95,
                        radius: Math.random() * 1.3 + 0.4,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: Math.random(),
                        speed: Math.random() * 0.03 + 0.01,
                        twinkleFactor: Math.random() * Math.PI
                    });
                }

                const render = () => {
                    ctx.clearRect(0, 0, width, height);

                    stars.forEach(star => {
                        star.x += star.vx;
                        star.y += star.vy;
                        
                        if (star.x < 0) star.x = width;
                        if (star.x > width) star.x = 0;
                        if (star.y < 0) star.y = height;
                        if (star.y > height) star.y = 0;

                        star.twinkleFactor += star.speed;
                        const currentAlpha = Math.abs(Math.sin(star.twinkleFactor)) * 0.8 + 0.2;

                        ctx.save();
                        ctx.globalAlpha = currentAlpha;
                        ctx.fillStyle = star.color;
                        ctx.shadowBlur = star.radius > 0.9 ? 8 : 4;
                        ctx.shadowColor = star.color;

                        ctx.beginPath();
                        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                        ctx.fill();

                        if (star.radius > 0.9) {
                            ctx.strokeStyle = star.color;
                            ctx.lineWidth = 0.5;
                            ctx.beginPath();
                            ctx.moveTo(star.x - star.radius * 2.5, star.y);
                            ctx.lineTo(star.x + star.radius * 2.5, star.y);
                            ctx.moveTo(star.x, star.y - star.radius * 2.5);
                            ctx.lineTo(star.x, star.y + star.radius * 2.5);
                            ctx.stroke();
                        }

                        ctx.restore();
                    });

                    animationFrameId = requestAnimationFrame(render);
                };

                render();

                return () => {
                    window.removeEventListener('resize', handleResize);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />;
        }

        // Gemini AI Synthesis with Web Grounding for Accurate Topic-Specific Courses & Detailed Gist
        async function fetchAISynthesizedCurriculum(topicName) {
            const topicKey = topicName.trim().toLowerCase();
            if (TOPIC_CURRICULA[topicKey]) {
                return TOPIC_CURRICULA[topicKey];
            }

            // Detect if running inside environment with valid Gemini API key
            const apiKey = (typeof window !== 'undefined' && window.GEMINI_API_KEY) ? window.GEMINI_API_KEY : ""; 

            if (!apiKey) {
                return synthesizeOfflineCurriculum(topicName);
            }

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const systemPrompt = `You are Astrae, a precision educational research AI. Search the live web to locate authentic, real-world courses and verified open-access resources specifically created for "${topicName}".
Generate:
1. "desc": A 2-3 sentence accurate academic overview defining "${topicName}", its core theoretical principles/mechanisms, and primary applications.
2. "courses": Exactly 9 REAL, HIGHLY SPECIFIC online courses/tutorials (3 BEGINNER, 3 INTERMEDIATE, 3 ADVANCED).
   - The title ("title") of each course card MUST start with or be equal to the source domain/platform name (e.g. "Harvard Online: Course Title", "MIT OpenCourseWare: Course Title", "Khan Academy: Course Title", "Coursera: Course Title").
   - Each course MUST be a real course or tutorial directly about "${topicName}" offered by genuine institutions.
   - Provide direct, valid search destination URLs on the specific platform for "${topicName}".`;
            
            const userPrompt = `Perform a targeted web search and return a genuine 9-course curriculum exclusively for "${topicName}". Output valid JSON matching the schema.`;

            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                tools: [{ "google_search": {} }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            title: { type: "STRING" },
                            desc: { type: "STRING", description: "Detailed 2-3 sentence academic overview/gist of the topic." },
                            courses: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        title: { type: "STRING" },
                                        type: { type: "STRING", enum: ["BEGINNER", "INTERMEDIATE", "ADVANCED"] },
                                        platform: { type: "STRING" },
                                        rating: { type: "STRING" },
                                        url: { type: "STRING" },
                                        badge: { type: "STRING" }
                                    },
                                    required: ["title", "type", "platform", "rating", "url", "badge"]
                                }
                            }
                        },
                        required: ["title", "desc", "courses"]
                    }
                }
            };

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                
                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (res.ok) {
                    const data = await res.json();
                    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) {
                        const parsed = JSON.parse(text);
                        if (parsed && parsed.courses && parsed.courses.length >= 9) {
                            return parsed;
                        }
                    }
                }
            } catch (err) {
                console.warn("AI web search synthesis executing offline, using local topic synthesis generator:", err);
            }

            return synthesizeOfflineCurriculum(topicName);
        }

                                        </h3>
                                        
                                        <p className="text-xs md:text-sm text-slate-200 max-w-md mx-auto mb-8 leading-relaxed font-medium">
                                            Query <span className="text-sky-300 font-mono font-bold">"{invalidQueryAttempt}"</span> appears to be unparsed cosmic noise or gibberish. Our astronaut is fishing for ideals in the dark void.
                                        </p>

                                        <button 
                                            onClick={handleLogoClick}
                                            className="px-8 py-3 rounded-full bg-gradient-to-r from-sky-400 via-indigo-500 to-pink-500 text-slate-950 font-black text-xs shadow-[0_0_20px_rgba(56,189,248,0.4)] hover:opacity-90 transition-all"
                                        >
                                            RETURN TO SYNTHESIS HUB
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* SAVED VAULT VIEW */}
                            {view === 'saved' && (
                                <div className="w-full max-w-4xl space-y-6 py-6 animate-view-fade">
                                    <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                                        <div>
                                            <h2 className="text-2xl font-black text-white">Saved Curricula Vault</h2>
                                            <p className="text-xs text-slate-300 font-medium">Locally stored syntheses and customized learning pathways</p>
                                        </div>
                                        <button 
                                            onClick={handleLogoClick}
                                            className="px-4 py-2 rounded-full border border-slate-700 bg-slate-900 text-xs font-semibold text-slate-200 hover:bg-slate-800 transition-all"
                                        >
                                            ← BACK TO SEARCH
                                        </button>
                                    </div>

                                    {savedCourses.length === 0 ? (
                                        <div className="text-center py-20 border gradient-border-glow bg-slate-950/60 rounded-2xl">
                                            <p className="text-4xl mb-3">✦</p>
                                            <h3 className="text-lg font-bold text-slate-100 mb-1">Your Vault is Empty</h3>
                                            <p className="text-xs text-slate-300 mb-6 font-medium">Synthesize any topic and click 'SAVE TO VAULT' to store curricula here.</p>
                                            <button 
                                                onClick={handleLogoClick}
                                                className="px-6 py-2.5 rounded-full bg-sky-400 text-slate-950 font-bold text-xs"
                                            >
                                                START EXPLORING
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {savedCourses.map((item, idx) => (
                                                <div key={idx} className="border gradient-border-glow bg-slate-950/80 rounded-2xl p-6 space-y-3 hover:border-amber-400 transition-all relative group">
                                                    <div className="flex items-center justify-between">
                                                        <span className="px-2.5 py-0.5 rounded text-[10px] font-extrabold bg-amber-500/10 text-amber-300 border border-amber-500/30">SAVED CURRICULUM</span>
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-xs text-slate-300 font-medium">9 Courses</span>
                                                            <button 
                                                                onClick={(e) => handleDeleteVaultItem(idx, e)}
                                                                className="px-2 py-1 rounded bg-rose-500/10 border border-rose-500/30 text-[10px] font-bold text-rose-300 hover:bg-rose-500/20 hover:border-rose-500/50 transition-all"
                                                                title="Delete curriculum from vault"
                                                            >
                                                                ✕ DELETE
                                                            </button>
                                                        </div>
                                                    </div>
                                                    <h3 className="text-xl font-bold text-white">{item.title}</h3>
                                                    <p className="text-xs text-slate-300 line-clamp-2 font-medium">{item.desc}</p>
                                                    <button 
                                                        onClick={() => { setCurrentCurriculum(item); setView('results'); }}
                                                        className="w-full py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-sky-300 hover:bg-slate-800 transition-all"
                                                    >
                                                        VIEW CURRICULUM →
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                        </main>

                        {/* RIGHT COLUMN: Engine Telemetry Panel */}
                        <aside className="hidden lg:flex flex-col border gradient-border-glow bg-slate-950/70 backdrop-blur-md rounded-2xl p-4 overflow-hidden h-[calc(100vh-140px)] sticky top-24 shadow-2xl">
                            <div className="mb-4 pb-3 border-b border-slate-800">
                                <h2 className="text-xs font-extrabold tracking-wider text-sky-300 uppercase">Engine Telemetry</h2>
                                <p className="text-[10px] text-slate-300 font-medium">Knowledge Indexing Core</p>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                                {TELEMETRY_ITEMS.map((item, idx) => (
                                    <div key={idx} className="p-3 rounded-xl bg-slate-900/60 border gradient-border-glow hover:border-sky-400/40 transition-all">
                                        <h3 className="text-[11px] font-bold text-sky-300 tracking-wide mb-1">{item.title}</h3>
                                        <p className="text-[10px] text-slate-300 leading-relaxed font-medium">{item.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </aside>

                    </div>

                    {/* Footer */}
                    <footer className="relative z-20 flex items-center justify-between px-6 py-4 border-t gradient-border-glow bg-[#05050b]/80 backdrop-blur-md text-[11px] text-slate-300 font-medium">
                        <div>ACTIVE KNOWLEDGE SYNTHESIS CORE // V5.2</div>
                        <div className="flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-sky-400 animate-ping"></span>
                            <span>VERIFIED OPEN-ACCESS KNOWLEDGE AGGREGATOR</span>
                        </div>
                    </footer>
                </div>
            );
        }

        function renderApp() {
            const rootElement = document.getElementById('root');
            if (rootElement && typeof ReactDOM !== 'undefined') {
                ReactDOM.render(<App />, rootElement);
            }
        }

        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', renderApp);
        } else {
            renderApp();
        }
    </script>
</body>
</html>
